name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/tauri.conf.json', 'package.json', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-
            windows-cargo-

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Clean stale bundle artifacts
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue src-tauri/target/release/bundle
          Get-ChildItem -Path src-tauri/target -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne 'debug' } |
            ForEach-Object {
              $bundle = Join-Path $_.FullName "release/bundle"
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $bundle
            }

      - name: Build
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        # Windows updater 必须发布 NSIS installer，而不是 release 目录下的裸 exe。
        # createUpdaterArtifacts=true 会同时生成 setup.exe.sig。
        run: pnpm build && ./node_modules/.bin/tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-windows-updater
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/nrl-pulse.exe

  build-windows-msix:
    name: Windows MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-msix-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/tauri.conf.json', 'src-tauri/tauri.store.json', 'package.json', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            windows-msix-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-
            windows-msix-cargo-

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Clean stale bundle artifacts
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue src-tauri/target/release/bundle
          Get-ChildItem -Path src-tauri/target -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne 'debug' } |
            ForEach-Object {
              $bundle = Join-Path $_.FullName "release/bundle"
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $bundle
            }

      - name: Write MSIX signing certificate
        id: msix_cert
        shell: powershell
        run: |
          if ("${{ secrets.MSIX_CERTIFICATE_BASE64 }}") {
            New-Item -ItemType Directory -Path "src-tauri/target" -Force | Out-Null
            $bytes = [Convert]::FromBase64String("${{ secrets.MSIX_CERTIFICATE_BASE64 }}")
            [IO.File]::WriteAllBytes("src-tauri/target/msix-cert.pfx", $bytes)
            "has_cert=true" >> $env:GITHUB_OUTPUT
          } else {
            "has_cert=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build store binary (updater disabled)
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: pnpm build && ./node_modules/.bin/tauri build --config src-tauri/tauri.store.json --no-bundle

      - name: Pack MSIX
        env:
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_CERT: ${{ steps.msix_cert.outputs.has_cert == 'true' && 'src-tauri/target/msix-cert.pfx' || '' }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File src-tauri/store/build-msix.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-windows-msix
          path: src-tauri/target/msix/*.msix
          if-no-files-found: error

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/tauri.conf.json', 'package.json', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-
            linux-cargo-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Clean stale bundle artifacts
        run: find src-tauri/target -maxdepth 3 -type d -name bundle -exec rm -rf {} +

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm build && ./node_modules/.bin/tauri build --target x86_64-unknown-linux-gnu --no-bundle

      - name: Sign Linux binary
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          ./node_modules/.bin/tauri signer sign --password "" \
            src-tauri/target/x86_64-unknown-linux-gnu/release/nrl-pulse

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-linux
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/nrl-pulse

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-linux-sig
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/nrl-pulse.sig

  build-mac:
    name: macOS (ARM + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: mac-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/tauri.conf.json', 'package.json', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            mac-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-
            mac-cargo-

      - name: Generate icon.icns
        run: |
          mkdir -p /tmp/nrl.iconset
          sips -z 16 16     src-tauri/icons/icon.png --out /tmp/nrl.iconset/icon_16x16.png
          sips -z 32 32     src-tauri/icons/icon.png --out /tmp/nrl.iconset/icon_16x16@2x.png
          sips -z 32 32     src-tauri/icons/icon.png --out /tmp/nrl.iconset/icon_32x32.png
          sips -z 64 64     src-tauri/icons/icon.png --out /tmp/nrl.iconset/icon_32x32@2x.png
          sips -z 128 128   src-tauri/icons/icon.png --out /tmp/nrl.iconset/icon_128x128.png
          sips -z 256 256   src-tauri/icons/icon.png --out /tmp/nrl.iconset/icon_128x128@2x.png
          sips -z 256 256   src-tauri/icons/icon.png --out /tmp/nrl.iconset/icon_256x256.png
          sips -z 512 512   src-tauri/icons/icon.png --out /tmp/nrl.iconset/icon_256x256@2x.png
          sips -z 512 512   src-tauri/icons/icon.png --out /tmp/nrl.iconset/icon_512x512.png
          cp src-tauri/icons/icon.png                    /tmp/nrl.iconset/icon_512x512@2x.png
          iconutil -c icns /tmp/nrl.iconset -o src-tauri/icons/icon.icns

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Clean stale bundle artifacts
        run: find src-tauri/target -maxdepth 3 -type d -name bundle -exec rm -rf {} +

      - name: Build ARM
        env:
          # CMake 4.x 移除了对 <3.5 老项目的兼容，audiopus_sys 内置 opus 还是老声明
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm build && ./node_modules/.bin/tauri build --target aarch64-apple-darwin

      - name: Build Intel x86_64
        env:
          # 同 ARM：audiopus_sys 内置 opus 与老 CMake 声明的兼容
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./node_modules/.bin/tauri build --target x86_64-apple-darwin

      - name: Collect macOS bundle artifacts
        run: |
          echo "=== bundle output ==="
          find src-tauri/target/aarch64-apple-darwin/release/bundle -type f | sort
          find src-tauri/target/x86_64-apple-darwin/release/bundle -type f | sort
          echo "====================="

          find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" -exec cp {} nrl-pulse-mac-arm.dmg \;
          find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" -exec cp {} nrl-pulse-mac-x64.dmg \;

          # updater artifacts (.app.tar.gz) — optional, only present when createUpdaterArtifacts: true takes effect
          find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz"     -exec cp {} nrl-pulse-mac-arm.app.tar.gz \; || true
          find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name "*.app.tar.gz"     -exec cp {} nrl-pulse-mac-x64.app.tar.gz \; || true
          find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app.tar.gz.sig" -exec cp {} nrl-pulse-mac-arm.app.tar.gz.sig \; || true
          find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -name "*.app.tar.gz.sig" -exec cp {} nrl-pulse-mac-x64.app.tar.gz.sig \; || true

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-mac-arm
          path: nrl-pulse-mac-arm.dmg

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-mac-arm-updater
          path: nrl-pulse-mac-arm.app.tar.gz
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-mac-arm-sig
          path: nrl-pulse-mac-arm.app.tar.gz.sig
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-mac-x64
          path: nrl-pulse-mac-x64.dmg

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-mac-x64-updater
          path: nrl-pulse-mac-x64.app.tar.gz
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nrl-pulse-mac-x64-sig
          path: nrl-pulse-mac-x64.app.tar.gz.sig
          if-no-files-found: warn

  release:
    name: Release
    needs: [build-windows, build-windows-msix, build-linux, build-mac]
    runs-on: ubuntu-latest
    # push main 或手动触发时发布
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          cp artifacts/nrl-pulse-windows/nrl-pulse.exe              nrl-pulse-windows.exe
          find artifacts/nrl-pulse-windows-updater -name "*-setup.exe" -exec cp {} nrl-pulse-windows-setup.exe \;
          find artifacts/nrl-pulse-windows-updater -name "*-setup.exe.sig" -exec cp {} nrl-pulse-windows-setup.exe.sig \;
          find artifacts/nrl-pulse-windows-msix -name "*.msix" -exec cp {} nrl-pulse-windows.msix \;
          cp artifacts/nrl-pulse-linux/nrl-pulse                    nrl-pulse-linux
          cp artifacts/nrl-pulse-linux-sig/nrl-pulse.sig            nrl-pulse-linux.sig
          cp artifacts/nrl-pulse-mac-arm/nrl-pulse-mac-arm.dmg              nrl-pulse-mac-arm.dmg
          cp artifacts/nrl-pulse-mac-x64/nrl-pulse-mac-x64.dmg              nrl-pulse-mac-x64.dmg
          cp artifacts/nrl-pulse-mac-arm-updater/nrl-pulse-mac-arm.app.tar.gz     nrl-pulse-mac-arm.app.tar.gz     2>/dev/null || true
          cp artifacts/nrl-pulse-mac-x64-updater/nrl-pulse-mac-x64.app.tar.gz     nrl-pulse-mac-x64.app.tar.gz     2>/dev/null || true
          cp artifacts/nrl-pulse-mac-arm-sig/nrl-pulse-mac-arm.app.tar.gz.sig     nrl-pulse-mac-arm.sig            2>/dev/null || true
          cp artifacts/nrl-pulse-mac-x64-sig/nrl-pulse-mac-x64.app.tar.gz.sig     nrl-pulse-mac-x64.sig            2>/dev/null || true

      - name: Generate latest.json
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE="https://github.com/hicaoc/nrl-pulse/releases/download/${VERSION}"
          WIN_SIG=$(cat nrl-pulse-windows-setup.exe.sig)
          LIN_SIG=$(cat nrl-pulse-linux.sig)
          MAC_ARM_SIG=$(cat nrl-pulse-mac-arm.sig 2>/dev/null || echo "")
          MAC_X64_SIG=$(cat nrl-pulse-mac-x64.sig 2>/dev/null || echo "")

          # Windows signature is mandatory for auto-updater
          if [ -z "$WIN_SIG" ]; then echo "ERROR: Windows signature is empty"; exit 1; fi

          # Sanity check: Windows signature should reference the correct version
          SIG_COMMENT=$(echo "$WIN_SIG" | base64 -d 2>/dev/null | grep -o "NRL Pulse_[^_]*_x64-setup.exe" || true)
          echo "Windows installer reference in signature: $SIG_COMMENT"
          if [ -n "$SIG_COMMENT" ] && [[ "$SIG_COMMENT" != *"${VERSION#v}"* ]]; then
            echo "ERROR: Windows signature references a different version: $SIG_COMMENT"; exit 1
          fi

          # Warn about missing macOS signatures (common when Apple certs are not configured)
          [ -z "$MAC_ARM_SIG" ] && echo "WARN: macOS ARM signature missing; omitting darwin-aarch64 from latest.json"
          [ -z "$MAC_X64_SIG" ] && echo "WARN: macOS x64 signature missing; omitting darwin-x86_64 from latest.json"

          # Build platform JSON dynamically
          PLATFORMS=''
          PLATFORMS+="\"windows-x86_64\": { \"url\": \"${BASE}/nrl-pulse-windows-setup.exe\", \"signature\": \"${WIN_SIG}\" }"
          PLATFORMS+=", \"linux-x86_64\": { \"url\": \"${BASE}/nrl-pulse-linux\", \"signature\": \"${LIN_SIG}\" }"
          [ -n "$MAC_ARM_SIG" ] && PLATFORMS+=", \"darwin-aarch64\": { \"url\": \"${BASE}/nrl-pulse-mac-arm.app.tar.gz\", \"signature\": \"${MAC_ARM_SIG}\" }"
          [ -n "$MAC_X64_SIG" ] && PLATFORMS+=", \"darwin-x86_64\": { \"url\": \"${BASE}/nrl-pulse-mac-x64.app.tar.gz\", \"signature\": \"${MAC_X64_SIG}\" }"

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes at ${BASE}",
            "pub_date": "${DATE}",
            "platforms": {
              ${PLATFORMS}
            }
          }
          EOF

          echo "latest.json content:"
          cat latest.json

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            nrl-pulse-windows.exe
            nrl-pulse-windows-setup.exe
            nrl-pulse-windows.msix
            nrl-pulse-linux
            nrl-pulse-mac-arm.dmg
            nrl-pulse-mac-x64.dmg
            latest.json

      - name: Upload macOS updater artifacts (optional)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for f in nrl-pulse-mac-arm.app.tar.gz nrl-pulse-mac-arm.sig nrl-pulse-mac-x64.app.tar.gz nrl-pulse-mac-x64.sig; do
            if [ -f "$f" ]; then
              echo "Uploading $f"
              gh release upload "$VERSION" "$f" --clobber || true
            else
              echo "Skipping missing $f"
            fi
          done

  # 发布到 GitHub Pages，提供不跳转的直链，供微软商店/Partner Center 抓取。
  # 产物路径: download/<version>/setup.exe
  publish-pages:
    name: Publish direct-download to GitHub Pages
    needs: build-windows
    runs-on: ubuntu-latest
    # 与 release 相同触发条件；PR 不发布
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4.3.0
        with:
          name: nrl-pulse-windows-updater
          path: artifacts

      - name: Prepare Pages directory
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p site/download/${VERSION}
          touch site/.nojekyll
          cp docs/privacy.html site/privacy.html
          find artifacts -name "*-setup.exe" ! -name "*.sig" -exec cp {} site/download/${VERSION}/setup.exe \;
          if [ ! -f site/download/${VERSION}/setup.exe ]; then
            echo "ERROR: setup.exe not found in artifact"; exit 1
          fi
          echo "Prepared site/download/${VERSION}/setup.exe and site/privacy.html"
          ls -la site/ site/download/${VERSION}/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

  # 自动提交 MSIX 到 Microsoft Store（Partner Center）。
  # 需要仓库 secrets: AZURE_AD_TENANT_ID / SELLER_ID /
  # AZURE_AD_APPLICATION_CLIENT_ID / AZURE_AD_APPLICATION_SECRET
  publish-store:
    name: Publish to Microsoft Store
    needs: build-windows-msix
    runs-on: windows-latest
    # 暂不随 main 自动发布；Entra secrets 配好前仅手动触发。
    # 配好后改回与 release 相同的条件即可恢复自动发布。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: nrl-pulse-windows-msix
          path: msix

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure store credentials
        run: msstore reconfigure `
              --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
              --sellerId ${{ secrets.SELLER_ID }} `
              --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
              --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish MSIX to Store
        shell: powershell
        run: |
          $msix = Get-ChildItem msix/*.msix | Select-Object -First 1
          if (-not $msix) { throw "MSIX artifact not found" }
          msstore publish $msix.FullName -id 9P5JP4MMGBDV
