[package]
name = "nrl-pulse"
version = "0.2.8"
description = "Modern cross-platform NRL desktop client"
authors = ["Codex"]
edition = "2021"

[lib]
name = "nrl_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
ciborium = "0.2"
chrono = "0.4"
cpal = "0.16.0"
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
encoding_rs = "0.8"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
mac_address = "1"
opus = "0.3"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.9", default-features = false }
sha2 = "0.10"
tauri = { version = "2.3.1", features = ["devtools", "macos-private-api"] }
tauri-plugin-dialog = "2.2.1"
tauri-plugin-fs = "2.2.1"
tauri-plugin-opener = "2.2.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rubato = "2.0.0"
audioadapter-buffers = "3.0.0"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
nnnoiseless = "0.5"
rustfft = "6"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2", features = ["audio_unit", "audio_toolbox"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell_PropertiesSystem",
] }
